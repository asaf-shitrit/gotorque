version: 2

project_name: gotorque

before:
  hooks:
    - go mod tidy

builds:
  - id: gotorque
    main: ./cmd/gotorque
    binary: gotorque
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/asaf-shitrit/gotorque/internal/version.Version={{.Version}} -X github.com/asaf-shitrit/gotorque/internal/version.Commit={{.Commit}} -X github.com/asaf-shitrit/gotorque/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  # Notes are hand-written and passed with --release-notes (make release).
  disable: true

release:
  draft: false
