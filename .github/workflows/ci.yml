name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Container grants SYS_ADMIN so bubblewrap (used by local campaign
    # isolation on Linux) can create network namespaces.
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
      options: --cap-add SYS_ADMIN
    steps:
      - uses: actions/checkout@v4

      - name: Install benchstat and bubblewrap
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          apt-get update && apt-get install -y bubblewrap git patch make

      - name: Complexity lint (cyclomatic + cognitive)
        run: make lint

      # golang:*-bookworm ships gcc/libc6-dev, so cgo (which -race requires)
      # is available without extra apt packages.
      - name: Unit tests
        run: go test -race ./...

      # Blocking: the backlog is cleared, so a function above CRAP 30 now fails
      # the build instead of only annotating it.
      - name: CRAP score (change risk anti-patterns)
        run: make crap-check

      - name: Build operator CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go build -o /tmp/gotorque ./cmd/gotorque

      - name: Validate target manifests
        run: |
          for m in targets/*/manifest.json; do
            /tmp/gotorque manifest validate "$m"
          done

      - name: Deterministic campaign smoke test (no network, no model)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git clone --depth 1 https://github.com/itchyny/gojq /tmp/gojq
          cd /tmp/gojq && git checkout -b pinned && git commit --allow-empty -m "pin" || true
          /tmp/gotorque optimize \
            --repo /tmp/gojq \
            --manifest $GITHUB_WORKSPACE/targets/gojq/manifest.json \
            --adk-stub 2>&1 | tee /tmp/smoke.log
          grep -q "campaign .* complete" /tmp/smoke.log || {
            echo "=== smoke failed; dumping diagnostics ==="
            cache_dir="$(go env GOCACHE 2>/dev/null || true)"; homedir="${HOME:-/root}"
            find "$homedir/.cache" /tmp -type f \( -name "*stderr" -o -name "*stdout" \) -mmin -15 2>/dev/null | while read f; do
              echo "== $f"; tail -c 2000 "$f"
            done
            which bwrap && bwrap --version || true
            exit 1
          }
